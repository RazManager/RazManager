name: razmanager
base: core24
version: '0.2.0'
summary: Race Management System (RMS) for slot cars
description: |
  RazManager lets you manage, take part in or simply view slot car events.
  This snap, the RazManager client, is for users before, during or after a slot car event.
  There are (will be) other snaps for integration of track interfaces and gadgets, and another
  one for permanently and temporarily installed displays at the venue.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  razmanager:
    command: razmanager
    extensions: [gnome]
    plugs:
    - network
parts:
  razmanager:
    source: ../../razmanager
    source-type: local
    plugin: flutter
    flutter-target: lib/main.dart