syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "razmanager/protobuf/public/summary_command_type_id.v1.proto";
import "razmanager/protobuf/public/race.v1.proto";

package razmanager.protobuf.public.v1;


service RaceService {
  rpc Subscribe (google.protobuf.StringValue) returns (stream Race);
  //rpc RaceStateSubscribe (RaceSessionRequest) returns (stream RaceState);
  rpc Command (RaceCommandRequest) returns (google.protobuf.Empty);
  rpc CommandPermissions (google.protobuf.StringValue) returns (SummaryCommandPermissions);
}


message RaceCommandRequest {
  string id = 1;
  SummaryCommandTypeId race_command_type_id = 2;
}