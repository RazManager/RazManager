syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "razmanager/protobuf/public/session_type_id.v1.proto";
import "razmanager/protobuf/public/race.v1.proto";

package razmanager.protobuf.public.v1;


service RaceService {
  rpc Subscribe (google.protobuf.StringValue) returns (stream Race);
  rpc RaceStateSubscribe (RaceSessionRequest) returns (stream RaceState);
  rpc RaceLeaderboardSubscribe (RaceSessionRequest) returns (stream RaceLeaderboard);
  rpc Command (RaceCommandRequest) returns (google.protobuf.Empty);
  rpc CommandPermissions (google.protobuf.StringValue) returns (RaceCommandPermissions);
}


message RaceSessionRequest {
  string id = 1;
  SessionTypeId session_type_id = 2;
}


message RaceCommandRequest {
  string id = 1;
  RaceCommandTypeId race_command_type_id = 2;
}