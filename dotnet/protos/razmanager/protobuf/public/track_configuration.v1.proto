syntax = "proto3";

import "razmanager/protobuf/public/track.v1.proto";
import "razmanager/protobuf/public/device_configuration_feature_type_id.v1.proto";

package razmanager.protobuf.public.v1;


message TrackConfiguration {
  string id = 1;
  string name = 2;
  Track track = 3;
  repeated DeviceConfigurationFeatureTypeId device_configuration_features = 4;
}