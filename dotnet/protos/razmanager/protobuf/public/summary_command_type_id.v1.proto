syntax = "proto3";

package razmanager.protobuf.public.v1;

enum SummaryCommandTypeId {
  SUMMARY_COMMAND_TYPE_ID_START = 0;
  SUMMARY_COMMAND_TYPE_ID_END = 2;
  SUMMARY_COMMAND_TYPE_ID_RESET = 3;
}

message SummaryCommandRequest {
  string id = 1;
  SummaryCommandTypeId command_type_id = 2;
}

message SummaryCommandPermissions {
  repeated SummaryCommandTypeId items = 1;
}