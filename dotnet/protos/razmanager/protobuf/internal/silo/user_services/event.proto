syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "razmanager/protobuf/public/event_speech_type_id.v1.proto";

package razmanager.protobuf.internal.silo.user_services.event;


message EventSpeechTexts {
  repeated EventSpeechText items = 1;
}

message EventSpeechText {
  public.v1.EventSpeechTypeId event_speech_type_id = 1;
  string text = 2;
  bool slow = 3;
  google.protobuf.DoubleValue time = 4;
}