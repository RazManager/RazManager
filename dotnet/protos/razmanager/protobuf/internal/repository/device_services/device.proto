syntax = "proto3";

import "google/protobuf/empty.proto";
import "razmanager/protobuf/public/device.v1.proto";

package razmanager.protobuf.internal.repository.device_services.device;


service DeviceService {
  rpc DeviceInformation (DeviceInformationRequest) returns (google.protobuf.Empty);
}

message DeviceInformationRequest {
  string id = 1;
  public.v1.DeviceInformation device_information = 2;
}