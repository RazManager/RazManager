syntax = "proto3";

package razmanager.protobuf.internal.repository.crud_services.common;


message IdRequest {
  string id = 1;
}

message EtagRequest {
  string etag = 1;
}

message CreateResponse {
  string id = 1;
  string etag = 2;
}

message UpdateResponse {
  string etag = 1;
}

message DeleteRequest {
  string id = 1;
  string etag = 2;
}

message ListRequest {
  int32 limit = 1;
  int32 offset = 2;
}