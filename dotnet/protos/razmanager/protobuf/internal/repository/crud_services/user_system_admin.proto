syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "razmanager/protobuf/internal/repository/crud_services/common.proto";
import "razmanager/protobuf/internal/repository/system_services/common.proto";

package razmanager.protobuf.internal.repository.crud_services.user_system_admin;


service UserSystemAdminService {
  rpc Read (common.IdRequest) returns (UserSystemAdminReadResponse);
  rpc Delete (common.DeleteRequest) returns (google.protobuf.Empty);
  rpc List (common.ListRequest) returns (UserSystemAdminListResponse);
}


message UserSystemAdminReadResponse {
  UserSystemAdminRead entity = 1;
  string etag = 2;
}

message UserSystemAdminRead {
  string id = 1;
  system_services.common.Idp idp = 2;
  google.protobuf.StringValue email = 3;
  string name = 4;
}


message UserSystemAdminListResponse {
  repeated UserSystemAdminList result = 1;
}

message UserSystemAdminList {
  string id = 1;
  system_services.common.Idp idp = 2;
  google.protobuf.StringValue email = 3;
  string name = 4;
}
