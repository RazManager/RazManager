syntax = "proto3";

import "google/protobuf/empty.proto";

package razmanager.protobuf.internal.repository.crud_services.race_format_type;


service RaceFormatTypeService {
  rpc Select (google.protobuf.Empty) returns (RaceFormatTypeSelectResponse);
}


enum RaceFormatTypeId {
  RACE_FORMAT_TYPE_ID_UNDEFINED = 0;
  RACE_FORMAT_TYPE_ID_ALL_DRIVERS_ALL_LANES_NEXT = 1;
  RACE_FORMAT_TYPE_ID_ALL_DRIVERS_ALL_LANES_SPREAD = 2;
  RACE_FORMAT_TYPE_ID_ALL_DRIVERS_ALL_LANES_ALL_DRIVERS = 3;
  RACE_FORMAT_TYPE_ID_ALL_DRIVERS_UNIQUE_CONTROLLER = 4;
  RACE_FORMAT_TYPE_ID_STEP_UP = 5;
  RACE_FORMAT_TYPE_ID_CUSTOM = 6;
}


message RaceFormatTypeSelect {
  race_format_type.RaceFormatTypeId id = 1;
  string name = 2;
  bool indicator_event_user_combined = 3;
}

message RaceFormatTypeSelectResponse {
  repeated RaceFormatTypeSelect result = 1;
}