syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "razmanager/protobuf/public/summary_state_type_id.v1.proto";
import "razmanager/protobuf/public/heat_with_stints.v1.proto";

package razmanager.protobuf.internal.repository.system_services.heat_with_stints;


service HeatWithStintsService {
  rpc Read (google.protobuf.StringValue) returns (public.v1.HeatWithStints);
  rpc UpdateState (HeatWithStintsStateUpdateRequest) returns (google.protobuf.Empty);
}


message HeatWithStintsStateUpdateRequest {
  string id = 1;
  public.v1.SummaryStateTypeId state_type_id = 2;
}