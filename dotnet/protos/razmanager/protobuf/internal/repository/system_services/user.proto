syntax = "proto3";

import "google/protobuf/wrappers.proto";

package razmanager.protobuf.internal.repository.system_services.user;


service UserService {
  rpc SignIn (SignInRequest) returns (google.protobuf.StringValue);
  rpc IsAdministrator (IsAdministratorRequest) returns (google.protobuf.BoolValue);
}


message SignInRequest {
  string user_name = 1;
  string password = 2;
}


message IsAdministratorRequest {
  string user_id = 1;
}