syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "razmanager/protobuf/public/summary_state_type_id.v1.proto";
import "razmanager/protobuf/public/race_session.v1.proto";

package razmanager.protobuf.internal.repository.system_services.race_session;


service RaceSessionService {
  rpc Read (google.protobuf.StringValue) returns (public.v1.RaceSession);
  rpc UpdateState (RaceSessionStateUpdateRequest) returns (google.protobuf.Empty);
}


message RaceSessionStateUpdateRequest {
  string id = 1;
  public.v1.SummaryStateTypeId race_session_state_type_id = 2;
}