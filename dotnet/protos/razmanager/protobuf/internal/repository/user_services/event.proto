syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "razmanager/protobuf/internal/repository/user_services/tenant.proto";

package razmanager.protobuf.internal.repository.user_services.event;


service EventService {
  rpc Select (google.protobuf.Empty) returns (EventSelectResponse);
}


message EventAuthorizedRequest {
  string id = 1;
  google.protobuf.StringValue user_id = 4;
}


message EventSelectResponse {
  repeated EventSelect result = 1;
}

message EventSelect {
  string id = 1;
  string name = 2;
  google.protobuf.StringValue description = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.BytesValue image = 5;
  tenant.TenantSelect tenant = 6;
}